server {
    listen 80 default_server;
    server_name localhost 127.0.0.1 preview;
    if ($host !~ ^(localhost|127\.0\.0\.1|preview)$) { return 403; }
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }
    root /usr/share/nginx/html;
    index index.html;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    location / { try_files $uri $uri/ =404; }
}
