name: rdms-home-studio
services:
  preview:
    image: nginx:1.29.1-alpine
    ports:
      - "127.0.0.1:18082:80"
    volumes:
      - ./site:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    restart: unless-stopped
    networks:
      - studio
networks:
  studio:
    driver: bridge
