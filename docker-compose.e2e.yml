name: rdms-stage08-e2e

services:
  db:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: rdms_e2e
      POSTGRES_USER: rdms_e2e
      POSTGRES_PASSWORD: rdms_e2e_only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rdms_e2e -d rdms_e2e"]
      interval: 1s
      timeout: 3s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/data

  migration:
    build: ./backend
    command: ["alembic", "upgrade", "head"]
    environment: &backend-env
      DATABASE_URL: postgresql+psycopg://rdms_e2e:rdms_e2e_only@db:5432/rdms_e2e
      APP_TIMEZONE: Asia/Shanghai
      UPLOAD_ROOT: /data/uploads
      MAX_UPLOAD_BYTES: "104857600"
    depends_on:
      db:
        condition: service_healthy

  backend:
    build: ./backend
    environment: *backend-env
    depends_on:
      migration:
        condition: service_completed_successfully
    tmpfs:
      - /data/uploads:mode=1777
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/ready', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 30

  frontend:
    build: ./frontend
    volumes:
      - ./frontend/nginx.e2e.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy

  playwright:
    image: mcr.microsoft.com/playwright:v1.55.1-noble
    working_dir: /work
    volumes:
      - ./frontend:/work
    environment:
      CI: "1"
      PLAYWRIGHT_BASE_URL: http://frontend
    depends_on:
      frontend:
        condition: service_started
    command: ["sh", "-c", "npm ci && npx playwright test"]
